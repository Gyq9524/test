spring.application.name=FileCreater
server.port=5053
spring.servlet.multipart.max-file-size=100000MB
spring.servlet.multipart.max-request-size=100000MB

logging.open=true
logging.level.org.springframework=WARN
logging.level.root=INFO
logging.level.com.filecreater=DEBUG
logging.file.name=logs/app-info.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
server.servlet.context-path=/
logging.logback.rollingpolicy.total-size-cap=100MB
